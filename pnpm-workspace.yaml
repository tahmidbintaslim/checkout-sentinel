packages:
  - packages/*
  - apps/*
  - test/fixtures

# pnpm 11 runs dependency install scripts only for packages listed here.
allowBuilds:
  esbuild: true
  # Optional native speedup for BullMQ's msgpackr; the pure JS path is used without it.
  msgpackr-extract: false
  # Install-time analytics in swagger-ui-dist; not needed.
  '@scarf/scarf': false

# Security fixes for transitive dependencies whose parents have not released one yet.
overrides:
  # GHSA-67mh-4wv8-2f99 (DoS); reaches the API through @nestjs/platform-express.
  multer: '>=2.5.0 <3'
