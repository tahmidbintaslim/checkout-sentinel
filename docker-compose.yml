# Self-hosted stack: Postgres, Redis, the API with the dashboard (http://localhost:3000, API
# under /api, docs at /docs) and one worker. Copy .env.example to .env first. Scale workers with:
#   docker compose up -d --scale worker=3
name: checkout-sentinel

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/${POSTGRES_DB:-checkout_sentinel}
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Outbound URL checks (SSRF). Keep false unless every monitor author is trusted; see SECURITY.md.
  ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
  ALLOWED_TARGET_HOSTS: ${ALLOWED_TARGET_HOSTS:-}
  ALLOWED_TARGET_PORTS: ${ALLOWED_TARGET_PORTS:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-checkout_sentinel}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # BullMQ needs keys to survive memory pressure: never evict.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      <<: *app-env
      PORT: 3000
      API_TOKEN: ${API_TOKEN:-}
      MIGRATE_ON_BOOT: 'true'
      DASHBOARD_ENABLED: ${DASHBOARD_ENABLED:-true}
    # Read-only: the dashboard shows the screenshots and offers the traces workers write here.
    volumes:
      - artifacts:/data/artifacts:ro
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      PER_STORE_CONCURRENCY: ${PER_STORE_CONCURRENCY:-1}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      USER_AGENT_CONTACT_URL: ${USER_AGENT_CONTACT_URL:-}
      HOUSEKEEPING_INTERVAL_MS: ${HOUSEKEEPING_INTERVAL_MS:-}
      RUN_STALE_AFTER_MS: ${RUN_STALE_AFTER_MS:-}
      RUN_RETENTION_DAYS: ${RUN_RETENTION_DAYS:-}
    # One volume shared by every worker replica, so retention can remove any run's files.
    volumes:
      - artifacts:/data/artifacts
    # Chromium needs more shared memory than Docker's 64MB default.
    shm_size: 1gb
    depends_on:
      api:
        # The API applies migrations on boot; start journeys only after that.
        condition: service_healthy
      redis:
        condition: service_healthy
    # Journeys in flight get this long to finish after SIGTERM.
    stop_grace_period: 90s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  artifacts:
