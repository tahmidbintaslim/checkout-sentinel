name: Demo (GitHub Pages)

# Publishes the read-only dashboard demo (apps/web, vite build --mode demo) with the sample
# data committed in apps/web/demo/data/. Needs Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'packages/core/**', '.github/workflows/demo-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the demo under /<repo>/
        run: pnpm --filter @checkout-sentinel/web build:demo --base "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
