name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests (with the dashboard's), build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - name: Build the read-only demo
        run: pnpm --filter @checkout-sentinel/web build:demo

  integration:
    name: Integration and e2e tests (Chromium, Postgres, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: checkout_sentinel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://sentinel:sentinel@127.0.0.1:5432/checkout_sentinel_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the locked Playwright version
        working-directory: packages/core
        run: npx playwright install --with-deps chromium
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: checkout-sentinel-results/
          if-no-files-found: ignore

  docker:
    name: Docker images and compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          tags: checkout-sentinel-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          tags: checkout-sentinel-worker:ci
          load: true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
      - name: Start the stack and wait for healthchecks
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --silent http://localhost:3000/health
          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent http://localhost:3000/docs/openapi.json > /dev/null
          # The api image serves the built dashboard at /.
          curl --fail --silent http://localhost:3000/ | grep -q '<div id="app"></div>'
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
